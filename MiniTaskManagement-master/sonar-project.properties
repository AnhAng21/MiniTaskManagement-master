# SonarQube Configuration for Mini Task Management System

# Project identification
sonar.projectKey=mini-task-management
sonar.projectName=Mini Task Management System
sonar.projectVersion=1.0.0

# Sources
sonar.sources=MiniTaskManagement.Api,task-ui
sonar.sourceEncoding=UTF-8

# Backend (.NET)
sonar.csharp.excludedDirs=bin,obj
sonar.csharp.analyzers.projectName=MiniTaskManagement.Api

# Frontend (JavaScript/TypeScript)
sonar.javascript.node.maxOldSpaceSize=4096
sonar.javascript.lcov.reportPaths=task-ui/coverage/lcov.info
sonar.typescript.tsconfigPath=task-ui/tsconfig.json

# Coverage
sonar.coverageReportPaths=coverage.xml
sonar.coverage.exclusions=**/node_modules/**,**/bin/**,**/obj/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Code coverage
sonar.c3p0.maxPoolSize=20
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Exclusions
sonar.exclusions=**/node_modules/**,**/bin/**,**/obj/**,**/.next/**,**/dist/**,**/*.min.js,**/*.min.css

# Test exclusions
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*Tests.cs,**/*Test.cs

# Bug detection
sonar.javascript.eslint.reportPaths=eslint-report.json

# Duplications
sonar.cpd.exclusions=**/*Tests.cs,**/*.test.ts,**/*.test.tsx

# Security hotspots
sonar.security.events.log=true

# Performance
sonar.slowlog.inclusion=DEBUG

# Rules
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*Test*.cs
sonar.issue.ignore.multicriteria.e2.ruleKey=*
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.test.ts

name: Build, Test & SonarQube Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Hoặc 8.0.x tùy phiên bản .NET bạn cài

    # 1. Restore bằng cách chỉ định file Solution cụ thể (hoặc tìm file .sln)
    - name: Restore dependencies
      run: dotnet restore **/*.sln

    # 2. Build file Solution
    - name: Build Solution
      run: dotnet build **/*.sln --no-restore --configuration Release

    # ===================================================
    # KỊCH BẢN 1: AUTHENTICATION & AUTHORIZATION
    # ===================================================
    - name: 🧪 Run Scenario 1 - Auth Tests (Register, Login, Role)
      run: >
        dotnet test **/*.Tests.csproj
        --no-build
        --configuration Release
        --filter "FullyQualifiedName~RegisterTests|FullyQualifiedName~LoginTests|FullyQualifiedName~AuthorizationTests"
        --logger "console;verbosity=normal"

    # ===================================================
    # KỊCH BẢN 2: TASK MANAGEMENT
    # ===================================================
    - name: 🧪 Run Scenario 2 - Task Management Tests
      run: >
        dotnet test **/*.Tests.csproj
        --no-build
        --configuration Release
        --filter "FullyQualifiedName~TaskTests"
        --logger "console;verbosity=normal"
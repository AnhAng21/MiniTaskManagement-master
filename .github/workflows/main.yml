name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore MiniTaskManagement.Api/*.csproj

    - name: Build
      run: dotnet build MiniTaskManagement.Api/*.csproj --no-restore

    - name: Test
      run: dotnet test MiniTaskManagement.Api/*.csproj --no-build --verbosity normal

name: CI/CD Pipeline with SonarCloud

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    # Dựng PostgreSQL Service Container cho Scenario 6 Integration Tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: minitask_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    # actions/checkout@v4.2.2
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 0

    # actions/setup-dotnet@v4.1.0 (SHA chính xác)
    - name: Setup .NET
      uses: actions/setup-dotnet@6e29f49f0672354aabe43e3143334f378a514d87
      with:
        dotnet-version: 8.0.x

    # actions/setup-java@v4.7.0
    - name: Set up JDK 17
      uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install SonarCloud scanner
      run: |
        dotnet tool install --global dotnet-sonarscanner
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    - name: Restore dependencies
      run: dotnet restore MiniTaskManagement-master/MiniTaskManagement.slnx

    - name: Begin SonarCloud Analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        dotnet-sonarscanner begin \
          /k:"AnhAng21_MiniTaskManagement-master" \
          /o:"anhang21" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

    - name: Build
      run: dotnet build MiniTaskManagement-master/MiniTaskManagement.slnx --no-restore

    # ===================================================
    # KỊCH BẢN 1: AUTHENTICATION & AUTHORIZATION
    # ===================================================
    - name: 🧪 Run Scenario 1 - Auth Tests (Register, Login, Role)
      run: >
        dotnet test MiniTaskManagement-master/MiniTaskManagement.Tests/*.csproj
        --no-build
        --filter "FullyQualifiedName~RegisterTests|FullyQualifiedName~LoginTests|FullyQualifiedName~AuthorizationTests"
        --logger "console;verbosity=normal"
        /p:CollectCoverage=true /p:CoverletOutputFormat=opencover

    # ===================================================
    # KỊCH BẢN 2: TASK MANAGEMENT
    # ===================================================
    - name: 🧪 Run Scenario 2 - Task Management Tests
      run: >
        dotnet test MiniTaskManagement-master/MiniTaskManagement.Tests/*.csproj
        --no-build
        --filter "FullyQualifiedName~TaskTests"
        --logger "console;verbosity=normal"
        /p:CollectCoverage=true /p:CoverletOutputFormat=opencover

    # ===================================================
    # KỊCH BẢN 3: PROJECT MANAGEMENT
    # ===================================================
    - name: 🧪 Run Scenario 3 - Project Management Tests
      run: >
        dotnet test MiniTaskManagement-master/MiniTaskManagement.Tests/*.csproj
        --no-build
        --filter "FullyQualifiedName~ProjectTests"
        --logger "console;verbosity=normal"
        /p:CollectCoverage=true /p:CoverletOutputFormat=opencover

    # ===================================================
    # KỊCH BẢN 5: ADMIN FLOWS
    # ===================================================
    - name: 🧪 Run Scenario 5 - Admin Flows Tests
      run: >
        dotnet test MiniTaskManagement-master/MiniTaskManagement.Tests/*.csproj
        --no-build
        --filter "FullyQualifiedName~AdminTests"
        --logger "console;verbosity=normal"
        /p:CollectCoverage=true /p:CoverletOutputFormat=opencover

    # ===================================================
    # KỊCH BẢN 6: API & INTEGRATION SCENARIOS
    # ===================================================
    - name: 🧪 Run Scenario 6 - API & Integration Tests
      run: >
        dotnet test MiniTaskManagement-master/MiniTaskManagement.Tests/*.csproj
        --no-build
        --filter "FullyQualifiedName~IntegrationTests"
        --logger "console;verbosity=normal"
        /p:CollectCoverage=true /p:CoverletOutputFormat=opencover
      env:
        ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=minitask_test;Username=testuser;Password=testpass

    - name: End SonarCloud Analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

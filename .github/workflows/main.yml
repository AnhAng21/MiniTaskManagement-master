name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ==================== BACKEND BUILD & TEST ====================
  backend-build:
    runs-on: ubuntu-latest
    name: Backend - Build & Test (.NET)
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: minitask_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: |
        SLN_FILE=$(find . -maxdepth 2 -name "*.sln" | head -n 1)
        if [ -n "$SLN_FILE" ]; then
          dotnet restore "$SLN_FILE"
        else
          dotnet restore
        fi

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Install test dependencies
      run: |
        TEST_PROJ=$(find . -name "*Tests.csproj" | head -n 1)
        if [ -n "$TEST_PROJ" ]; then
          dotnet add "$TEST_PROJ" package Microsoft.AspNetCore.Mvc.Testing || true
        fi

    # ===================================================
    # RUN ALL TEST SCENARIOS
    # ===================================================
    - name: 🧪 Run All Unit & Integration Tests
      run: |
        dotnet test \
          --configuration Release \
          --no-build \
          --logger "trx;LogFileName=test-results.trx" \
          /p:CollectCoverage=true \
          /p:CoverageFormat=opencover \
          /p:CoverageFileName=coverage.xml
      env:
        ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=minitask_test;Username=testuser;Password=testpass

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-test-results
        path: '**/test-results.trx'

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage
        path: '**/coverage.xml'

  # ==================== FRONTEND BUILD & TEST ====================
  frontend-build:
    runs-on: ubuntu-latest
    name: Frontend - Build & Test (Next.js)
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies & Build Frontend
      run: |
        TARGET_DIR=$(find . -maxdepth 2 -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \;)
        echo "Found frontend directory at: $TARGET_DIR"
        cd "$TARGET_DIR"
        npm ci --ignore-scripts || npm install
        npm run lint || true
        npm test -- --coverage --watchAll=false --passWithNoTests || true
        npm run build

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage
        path: '**/coverage'

  # ==================== SECURITY CHECKS ====================
  security:
    runs-on: ubuntu-latest
    name: Security - Dependency Scanning
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET for backend scanning
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run dotnet audit
      run: dotnet audit || true
      continue-on-error: true

    - name: Setup Node.js for frontend scanning
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Run npm audit
      run: |
        TARGET_DIR=$(find . -maxdepth 2 -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \;)
        cd "$TARGET_DIR"
        npm ci --ignore-scripts || npm install
        npm audit --audit-level=moderate || true
      continue-on-error: true

    - name: Run Trivy filesystem scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

  # ==================== SONARQUBE ANALYSIS ====================
  sonarqube:
    runs-on: ubuntu-latest
    name: Code Quality - SonarQube Analysis
    needs: [backend-build, frontend-build, security]
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download backend coverage
      uses: actions/download-artifact@v4
      with:
        name: backend-coverage
        path: backend-coverage

    - name: Download frontend coverage
      uses: actions/download-artifact@v4
      with:
        name: frontend-coverage
        path: frontend-coverage

    - name: Setup Java for SonarQube scanner
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v5.0.0
      env:
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=mini-task-management
          -Dsonar.projectName=Mini Task Management
          -Dsonar.sources=.
          -Dsonar.javascript.lcov.reportPaths=frontend-coverage/lcov.info
          -Dsonar.coverageReportPaths=backend-coverage/coverage.xml

    - name: SonarQube Quality Gate Check
      uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
      timeout-minutes: 5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      continue-on-error: true

  # ==================== SUMMARY ====================
  summary:
    runs-on: ubuntu-latest
    name: Pipeline Summary
    needs: [backend-build, frontend-build, security, sonarqube]
    if: always()
    
    steps:
    - name: Pipeline Status
      run: |
        echo "✅ Backend Build & Tests: ${{ needs.backend-build.result }}"
        echo "✅ Frontend Build: ${{ needs.frontend-build.result }}"
        echo "🔒 Security Scan: ${{ needs.security.result }}"
        echo "📊 SonarQube Analysis: ${{ needs.sonarqube.result }}"
      shell: bash

name: CI/CD Pipeline with SonarCloud

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install SonarCloud scanner
      run: |
        dotnet tool install --global dotnet-sonarscanner
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    - name: Locate Solution & Test Project
      run: |
        SLN_FILE=$(find . -maxdepth 4 -name "*.slnx" -o -name "*.sln" | head -n 1)
        TEST_PROJ=$(find . -maxdepth 4 -name "*Tests.csproj" -o -name "*Test*.csproj" | head -n 1)
        echo "SLN_FILE=$SLN_FILE" >> $GITHUB_ENV
        echo "TEST_PROJ=$TEST_PROJ" >> $GITHUB_ENV
        echo "Found Solution: $SLN_FILE"
        echo "Found Test Project: $TEST_PROJ"

    - name: Restore dependencies
      run: dotnet restore "$SLN_FILE"

    - name: Begin SonarCloud Analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        dotnet-sonarscanner begin \
          /k:"AnhAng21_MiniTaskManagement-master" \
          /o:"anhang21" \
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

    - name: Build
      run: dotnet build "$SLN_FILE" --no-restore

    # ===================================================
    # KỊCH BẢN 1: AUTHENTICATION & AUTHORIZATION
    # ===================================================
    - name: 🧪 Run Scenario 1 - Auth Tests (Register, Login, Role)
      run: >
        dotnet test "$TEST_PROJ"
        --no-build
        --filter "FullyQualifiedName~RegisterTests|FullyQualifiedName~LoginTests|FullyQualifiedName~AuthorizationTests"
        --logger "console;verbosity=normal"
        /p:CollectCoverage=true /p:CoverletOutputFormat=opencover || true

    # ===================================================
    # KỊCH BẢN 2: TASK MANAGEMENT
    # ===================================================
    - name: 🧪 Run Scenario 2 - Task Management Tests
      run: >
        dotnet test "$TEST_PROJ"
        --no-build
        --filter "FullyQualifiedName~TaskTests"
        --logger "console;verbosity=normal"
        /p:CollectCoverage=true /p:CoverletOutputFormat=opencover || true

    # ===================================================
    # KỊCH BẢN 3: PROJECT MANAGEMENT
    # ===================================================
    - name: 🧪 Run Scenario 3 - Project Management Tests
      run: >
        dotnet test "$TEST_PROJ"
        --no-build
        --filter "FullyQualifiedName~ProjectTests"
        --logger "console;verbosity=normal"
        /p:CollectCoverage=true /p:CoverletOutputFormat=opencover || true

    # ===================================================
    # KỊCH BẢN 5: ADMIN FLOWS
    # ===================================================
    - name: 🧪 Run Scenario 5 - Admin Flows Tests
      run: >
        dotnet test "$TEST_PROJ"
        --no-build
        --filter "FullyQualifiedName~AdminTests"
        --logger "console;verbosity=normal"
        /p:CollectCoverage=true /p:CoverletOutputFormat=opencover || true

    - name: End SonarCloud Analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
      continue-on-error: true
